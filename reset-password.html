<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Softly Done</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #faf8f5;
      --card: #ffffff;
      --text: #1f1f1f;
      --muted: #5c5c5c;
      --border: #ebe6de;
      --accent: #3d5a4c;
      --error: #b42318;
      --success: #2e6b4e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 16px 64px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
    }
    main {
      max-width: 440px;
      margin: 40px auto 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 26px;
    }
    h1 { font-size: 1.55rem; margin: 0 0 6px; letter-spacing: -0.02em; }
    .subtitle { color: var(--muted); font-size: 0.94rem; margin: 0 0 24px; }
    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
      margin-bottom: 16px;
      background: #fff;
      color: var(--text);
    }
    input:focus {
      outline: none;
      border-color: var(--accent);
    }
    button {
      width: 100%;
      padding: 13px 16px;
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 0.98rem;
      font-weight: 500;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .msg {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.92rem;
      display: none;
    }
    .msg.error {
      display: block;
      background: #fef3f2;
      color: var(--error);
    }
    .msg.success {
      display: block;
      background: #eef7f2;
      color: var(--success);
    }
    footer {
      margin-top: 28px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      font-size: 0.85rem;
      color: var(--muted);
      text-align: center;
    }
    footer a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>Reset Password</h1>
    <p class="subtitle">Choose a new password for your Softly Done account.</p>

    <form id="reset-form">
      <label for="password">New password</label>
      <input id="password" type="password" minlength="6" required placeholder="At least 6 characters" />

      <label for="confirm">Confirm new password</label>
      <input id="confirm" type="password" minlength="6" required placeholder="Repeat your password" />

      <button id="submit-btn" type="submit">Update password</button>
    </form>

    <div id="status" class="msg"></div>

    <footer>
      Need help? <a href="mailto:softlydoneapp@gmail.com">softlydoneapp@gmail.com</a>
    </footer>
  </main>

  <script>
    const SUPABASE_URL = "https://zfjsnmongpymsbzpiwwv.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpmanNubW9uZ3B5bXNienBpd3d2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzNjEwNDIsImV4cCI6MjEwODkzNzA0Mn0.2pIN1teBYylFX9tRnCztCk-ku_NSJt0IROKoHhgRK9I";

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const form = document.getElementById("reset-form");
    const statusEl = document.getElementById("status");
    const submitBtn = document.getElementById("submit-btn");

    function showMessage(text, type) {
      statusEl.textContent = text;
      statusEl.className = "msg " + type;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;

      if (password.length < 6) {
        showMessage("Password must be at least 6 characters.", "error");
        return;
      }
      if (password !== confirm) {
        showMessage("Passwords do not match.", "error");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Updating...";

      const { data: sessionData } = await sb.auth.getSession();
      if (!sessionData.session) {
        showMessage("This reset link is invalid or has expired. Please request a new one from the app.", "error");
        submitBtn.disabled = false;
        submitBtn.textContent = "Update password";
        return;
      }

      const { error } = await sb.auth.updateUser({ password });
      if (error) {
        showMessage(error.message || "Could not update password. Please try again.", "error");
        submitBtn.disabled = false;
        submitBtn.textContent = "Update password";
        return;
      }

      form.style.display = "none";
      showMessage("Password updated. You can now return to Softly Done and sign in with your new password.", "success");
    });
  </script>
</body>
</html>
